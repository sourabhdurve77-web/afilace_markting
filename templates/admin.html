<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    margin: 20px;
}

/* Title */
h1 {
    text-align: center;
}

/* Form */
.form-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 400px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
}

button {
    width: 100%;
    padding: 10px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

/* PRODUCTS GRID */
.products {
    margin-top: 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

/* CARD */
.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    width: 250px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
    text-align: center;
}

/* IMAGE */
img {
    max-width: 100%;
    height: 120px;
    object-fit: cover;
    margin-top: 10px;
}

/* DELETE BUTTON */
.delete-btn {
    background: red;
    margin-top: 10px;
}

/* BUY LINK */
a {
    display: inline-block;
    margin-top: 10px;
    text-decoration: none;
    color: rgb(123, 160, 175);
}
</style>

</head>

<body>

<div>
    <ul class="navbar-nav me-auto">
    <li class="nav-item"><a class="nav-link" href="/logout">Home</a></li>
</ul>

</div>

<h1>Admin Panel</h1>

<!-- ADD PRODUCT -->
<div class="form-box">
<form method="POST" enctype="multipart/form-data">

    <input type="text" name="name" placeholder="Product Name" required>
    <input type="text" name="dicreption" placeholder="Description">
    <input type="text" name="price" placeholder="Price" required>
    <input type="text" name="discount" placeholder="Discount">
    <input type="text" name="link" placeholder="Buy Link">
    <input type="file" name="image" required>

    <button type="submit">Add Product</button>
</form>
</div>

<!-- SHOW PRODUCTS -->
<div class="products">

{% if products %}

{% for p in products %}
<div class="card">

    <h3>{{ p.name }}</h3>
    <p>{{ p.dicreption }}</p>
    <p><b>₹{{ p.price }}</b></p>
    <p>{{ p.discount }}</p>

    {% if p.image %}
    <img src="{{ url_for('image', id=p.id) }}">
    {% endif %}

    <a href="{{ p.link }}" target="_blank">Buy Now</a>

    <!-- DELETE -->
    <form action="{{ url_for('delete_product', id=p.id) }}" method="POST"
          onsubmit="return confirm('Delete this product?')">
        <button class="delete-btn">Delete</button>
    </form>

</div>
{% endfor %}

{% else %}
<h3>No Products Available</h3>
{% endif %}

</div>

</body>
</html>
