<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="pUjDyf5kzvNS_T197b9Vfh7To6J4yWudhc72FdU75nE" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DealPro Store</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f8fafc;
    color:#0f172a;
    font-family:'Segoe UI',sans-serif;
}

/* NAVBAR */
.navbar{
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
}
.navbar-brand{
    font-weight:700;
    font-size:22px;
    color:#2e1f61;
}
.nav-link{
    color:#513e7c!important;
}
.nav-link:hover{
    color:#1f1d31!important;
}

/* HERO */
.hero{
    background:linear-gradient(135deg,#5dbdf5,#3c608a);
    color:#fff;
    padding:80px 20px;
    text-align:center;
    border-radius:0 0 30px 30px;
}
.hero h1{
    font-size:42px;
    font-weight:700;
}
.hero p{
    font-size:18px;
}

/* PRODUCT BOX */
.product-box{
    background:#ffffff;
    border-radius:20px;
    padding:20px;
    margin-bottom:25px;
    transition:0.3s;
    border:1px solid #e5e7eb;
}
.product-box:hover{
    transform:translateY(-6px);
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* IMAGE */
.product-img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:15px;
}

/* TEXT */
.product-title{
    font-size:22px;
    font-weight:600;
}
.product-desc{
    color:#64748b;
    margin-top:8px;
    line-height:1.5;
}

.price{
    color:#16a34a;
    font-size:24px;
    font-weight:bold;
    margin-top:10px;
}

/* BADGE */
.badge-off{
    background:#ef4444;
    color:#fff;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
}

/* BUTTON */
.btn-buy{
    background:linear-gradient(45deg,#6366f1,#8b5cf6);
    border:none;
    color:#fff;
    font-weight:bold;
    padding:10px 18px;
    border-radius:12px;
    margin-top:12px;
    transition:0.3s;
}
.btn-buy:hover{
    opacity:0.9;
    transform:scale(1.05);
}

/* SEARCH */
form input{
    background:#f1f5f9;
    border:1px solid #cbd5f5;
    color:#000;
}
form input::placeholder{
    color:#64748b;
}

/* FOOTER */
.footer{
    background:#ffffff;
    padding:25px;
    text-align:center;
    margin-top:50px;
    border-top:1px solid #e5e7eb;
    color:#64748b;
}

/* MOBILE */
@media(max-width:768px){
    .hero h1{font-size:30px}
    .product-img{height:180px}
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg px-4">
<a class="navbar-brand" href="#">🔥 DealPro</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="nav">

<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
</ul>

<form method="GET" action="{{ url_for('Search') }}" class="d-flex me-2">
<input class="form-control me-2" type="search" name="q" placeholder="Search products">
<button class="btn btn-outline-primary">Search</button>
</form>

<form method="GET" action="{{ url_for('Login') }}" class="me-2">
<button class="btn btn-outline-dark">Login</button>
</form>

</div>
</nav>

<!-- HERO -->
<div class="hero">
<h1>Best Deals For You</h1>
<p>Save more on every purchase 🚀</p>
</div>

<div class="container mt-5">

{% for p in show %}

<div class="product-box">
<div class="row align-items-center g-4">

<div class="col-md-4">
<img src="{{ url_for('image', id=p.id) }}" class="product-img">
</div>

<div class="col-md-8">
<span class="badge-off">{{p.discount}}</span>
<div class="product-title mt-2">{{p.name}}</div>
<div class="product-desc">{{p.dicreption}}</div>
<div class="price">{{p.price}}</div>
<a href="{{ p.link }}" class="btn btn-buy" target="_blank">Buy Now</a>
</div>

</div>
</div>

{% endfor %}

</div>

<div class="footer">
<p>© 2026 DealPro Store | All Rights Reserved</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
